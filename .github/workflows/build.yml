name: Build FileUnlocker x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild "src\Snap.Hutao.FileUnlocker.sln" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0

      - name: Find build output
        shell: pwsh
        run: |
          Write-Host "Searching for EXE and DLL files..."

          Get-ChildItem -Path . -Recurse -File `
            -Include "Snap.Hutao.FileUnlocker.exe","Snap.Hutao.FileUnlocker.Core.dll" |
            Select-Object FullName

      - name: Prepare portable package
        shell: pwsh
        run: |
          $out = "release\Snap.Hutao.FileUnlocker-x64"

          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Get-ChildItem -Path . -Recurse -File `
            -Filter "Snap.Hutao.FileUnlocker.exe" |
            Where-Object { $_.FullName -match "\\x64\\Release\\" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Snap.Hutao.FileUnlocker.exe was not found."
            exit 1
          }

          Write-Host "EXE found:"
          Write-Host $exe.FullName

          Copy-Item $exe.FullName "$out\Snap.Hutao.FileUnlocker.exe" -Force

          $exeDir = $exe.Directory.FullName

          Get-ChildItem -Path $exeDir -File -Filter "*.dll" |
            Copy-Item -Destination $out -Force

          if (-not (Test-Path "$out\Snap.Hutao.FileUnlocker.Core.dll")) {
            $core = Get-ChildItem -Path . -Recurse -File `
              -Filter "Snap.Hutao.FileUnlocker.Core.dll" |
              Select-Object -First 1

            if ($core) {
              Copy-Item $core.FullName "$out\Snap.Hutao.FileUnlocker.Core.dll" -Force
            }
          }

          @"
          Snap.Hutao.FileUnlocker x64

          Usage:

          query:
          Snap.Hutao.FileUnlocker.exe query "C:\path\file.exe"

          query locks:
          Snap.Hutao.FileUnlocker.exe query-locks "C:\path\file.exe"

          unlock:
          Snap.Hutao.FileUnlocker.exe unlock-locks "C:\path\file.exe"

          Run CMD or PowerShell as Administrator for maximum process/handle coverage.
          "@ | Set-Content "$out\README.txt" -Encoding UTF8

          Write-Host ""
          Write-Host "FINAL PACKAGE:"
          Get-ChildItem $out

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "release\Snap.Hutao.FileUnlocker-x64\*" `
            -DestinationPath "release\Snap.Hutao.FileUnlocker-x64.zip" `
            -Force

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: Snap.Hutao.FileUnlocker-x64
          path: release/Snap.Hutao.FileUnlocker-x64.zip
          retention-days: 30
          if-no-files-found: error
