name: Build FileUnlocker x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          Write-Host "=== Building solution ==="

          msbuild "src\Snap.Hutao.FileUnlocker.sln" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /verbosity:minimal

      - name: Locate outputs
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== ALL EXE FILES ==="

          $exes = Get-ChildItem -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue

          if ($exes.Count -eq 0) {
            Write-Error "NO EXE FILE WAS GENERATED."
            exit 1
          }

          foreach ($file in $exes) {
            Write-Host $file.FullName
          }

          Write-Host ""
          Write-Host "=== ALL DLL FILES ==="

          Get-ChildItem -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter "*.dll" `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Find FileUnlocker executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter "Snap.Hutao.FileUnlocker.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host ""
            Write-Host "=== POSSIBLE EXECUTABLES ==="

            Get-ChildItem -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -Filter "*.exe" |
              Select-Object FullName

            Write-Error "Snap.Hutao.FileUnlocker.exe was not generated."
            exit 1
          }

          Write-Host "FOUND:"
          Write-Host $exe.FullName

          "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\release"

          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Get-Item $env:EXE_PATH
          $source = $exe.Directory.FullName

          Copy-Item $exe.FullName `
            "$out\Snap.Hutao.FileUnlocker.exe" `
            -Force

          Get-ChildItem $source -File -Filter "*.dll" |
            Copy-Item -Destination $out -Force

          Write-Host ""
          Write-Host "=== PACKAGE ==="
          Get-ChildItem $out

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\release\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\Snap.Hutao.FileUnlocker-x64.zip" `
            -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Snap.Hutao.FileUnlocker-x64
          path: Snap.Hutao.FileUnlocker-x64.zip
          retention-days: 30
          if-no-files-found: error
